name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: supermasio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ github.workspace }}/.ci-data
      PYTHONUNBUFFERED: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: your-secure-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m py_compile main.py

      - name: Run integration checks
        run: python test_features.py

  deploy:
    name: Deploy
    if: github.event_name == 'release'
    needs: ci
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-release
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Show deploy context
        run: |
          echo "::group::Deploy context"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "release_tag=${RELEASE_TAG}"
          echo "commit=${GITHUB_SHA}"
          echo "::endgroup::"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Deploy to Fly
        run: flyctl deploy --remote-only --app supermasio --yes --verbose
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
