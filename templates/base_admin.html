{% extends "base_mario.html" %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    /* Admin pages use Bootstrap layout inside Mario chrome */
    .mario-main { max-width: 100%; padding: 16px 12px; }

    /* Admin sidebar */
    .admin-sidebar {
        background: var(--m-white);
        border-radius: var(--m-radius);
        padding: 20px 16px;
        box-shadow: var(--m-shadow);
        margin-bottom: 16px;
    }
    .admin-sidebar .nav-link {
        color: var(--m-ink);
        padding: 10px 14px;
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.15s;
    }
    .admin-sidebar .nav-link:hover,
    .admin-sidebar .nav-link.active {
        background: var(--m-card-pink);
        color: var(--m-red);
    }

    /* Card overrides to match Mario theme */
    .card {
        border: none;
        border-radius: var(--m-radius);
        box-shadow: var(--m-shadow);
        overflow: hidden;
        margin-bottom: 16px;
    }
    .card-header {
        font-family: var(--m-display);
        border-bottom: 2px solid var(--m-card-pink);
        font-size: 1rem;
    }
    .card-header.bg-warning {
        background: linear-gradient(135deg, #ffc107, #ff9800) !important;
    }
    .card-header.bg-primary {
        background: linear-gradient(135deg, var(--m-red-bright), var(--m-red)) !important;
    }
    .card-header.bg-success {
        background: linear-gradient(135deg, #28a745, #1e7e34) !important;
    }
    .card-header.bg-danger {
        background: linear-gradient(135deg, #dc3545, #b02a37) !important;
    }
    .card-header.bg-secondary {
        background: linear-gradient(135deg, #6c757d, #545b62) !important;
    }
    .card-header.bg-info {
        background: linear-gradient(135deg, #17a2b8, #117a8b) !important;
    }

    /* Table overrides */
    .table { color: var(--m-ink); }
    .table thead th {
        font-family: var(--m-display);
        color: var(--m-red);
        border-bottom-width: 2px;
    }
    .table-warning td { background: #fff8e1; }

    /* Button overrides */
    .btn-primary {
        background: linear-gradient(135deg, var(--m-red-bright), var(--m-red));
        border-color: var(--m-red);
    }
    .btn-primary:hover {
        background: linear-gradient(135deg, #ff1a1a, #c00909);
        border-color: #c00909;
    }
    .btn-outline-primary {
        color: var(--m-red);
        border-color: var(--m-red);
    }
    .btn-outline-primary:hover {
        background: var(--m-red);
        border-color: var(--m-red);
    }
    .btn-outline-danger {
        color: #dc3545;
        border-color: #dc3545;
    }

    h2 { font-family: var(--m-display); color: var(--m-red); }

    /* Badge color fixes */
    .badge.bg-warning { color: #212529; }

    /* Modal overrides */
    .modal-content {
        border-radius: var(--m-radius);
        border: none;
    }
    .modal-header {
        background: var(--m-red);
        color: var(--m-white);
        font-family: var(--m-display);
    }
    .modal-header .btn-close { filter: invert(1); }

    /* Alert overrides */
    .alert-info {
        background: var(--m-card-pink);
        border-color: var(--m-red-accent);
        color: var(--m-red);
    }
    .alert-warning {
        background: #fff3cd;
        border-color: #ffc107;
    }
</style>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
{{ super() }}
{% endblock %}
