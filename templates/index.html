{% extends "base.html" %}

{% block title %}슈퍼 마시오{% endblock %}

{% block content %}
<div class="mario-home">
    <!-- Main Content Card -->
    <div class="mario-card home-card">
        <!-- Brand Area -->
        <div class="brand-area">
            <div class="super-masio-text">SUPER MASIO</div>
        </div>

        <!-- Welcome Text -->
        <p class="welcome-text">슈퍼 마시오에 오신 것을 환영합니다.</p>
        <p class="guide-text">이용하실 방식을 선택해주세요.</p>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="mario-btn" id="btnTableSelect">
                <span class="btn-main-text">테이블 선택하기</span>
                <span class="btn-sub-text">착석 후 선택해주세요</span>
            </button>
            <a href="/waiting" class="mario-btn mario-btn-link">
                <span class="btn-main-text">웨이팅 등록하기</span>
            </a>
        </div>
    </div>

    <!-- Table Selection Grid (hidden by default) -->
    <div class="mario-card table-grid-card" id="tableGridCard" style="display: none;">
        <div class="table-grid-header">
            <h2>테이블 선택</h2>
            <button class="table-grid-close" id="btnCloseTableGrid">&times;</button>
        </div>
        <div class="table-grid">
            {% for t in range(1, 51) %}
            <div class="table-cell" data-table-id="{{ t }}">
                <span class="table-number">{{ t }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<!-- Waiting Success Modal (shown when returning from /waiting with success) -->
<div class="modal-overlay" id="waitingSuccessModal" style="display: none;">
    <div class="mario-card modal-card">
        <div class="modal-icon">✓</div>
        <h3 class="modal-title">웨이팅 등록 완료!</h3>
        <p class="modal-message">자리가 나는 대로 연락드리겠습니다.<br>잠시만 기다려 주세요.</p>
        <button class="mario-btn modal-close-btn" id="btnModalClose">확인</button>
    </div>
</div>

<style>
/* ========================================
   SUPER MASIO HOME PAGE STYLES
   ======================================== */

.mario-home {
    min-height: calc(100vh - 120px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px 40px;
}

/* Mario Card Base */
.mario-card {
    background: #ffffff;
    border-radius: 37px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
    width: 100%;
    max-width: 420px;
}

/* Home Card */
.home-card {
    padding: 40px 28px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Brand Area */
.brand-area {
    margin-bottom: 24px;
}

.super-masio-text {
    font-family: 'Baloo 2', 'SeoulNamsan', sans-serif;
    font-size: 2.4rem;
    font-weight: 800;
    color: #E52521;
    letter-spacing: 3px;
    text-shadow:
        2px 2px 0 #FBD000,
        4px 4px 0 rgba(0,0,0,0.08);
    line-height: 1.2;
    text-align: center;
}

/* Welcome & Guide Text */
.welcome-text {
    font-family: 'SeoulNamsan', 'Nanum Gothic', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    color: #3a3a3a;
    text-align: center;
    margin: 0 0 6px;
    line-height: 1.5;
}

.guide-text {
    font-family: 'SeoulNamsan', 'Nanum Gothic', sans-serif;
    font-size: 0.95rem;
    font-weight: 400;
    color: #3a3a3a;
    text-align: center;
    margin: 0 0 32px;
    line-height: 1.5;
}

/* Action Buttons */
.action-buttons {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.mario-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 20px 24px;
    background: #E52521;
    color: #ffffff;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'SeoulNamsan', 'Nanum Gothic', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    box-shadow: 0 4px 0 #A11D1A, 0 6px 16px rgba(229, 37, 33, 0.25);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    text-decoration: none;
    position: relative;
    top: 0;
}

.mario-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #A11D1A, 0 10px 24px rgba(229, 37, 33, 0.35);
    color: #ffffff;
}

.mario-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #A11D1A, 0 2px 8px rgba(229, 37, 33, 0.2);
    top: 2px;
}

.mario-btn-link {
    text-decoration: none;
}

.btn-main-text {
    font-size: 1.2rem;
    font-weight: 700;
}

.btn-sub-text {
    font-size: 0.8rem;
    font-weight: 400;
    opacity: 0.85;
    margin-top: 2px;
}

/* Table Grid Card */
.table-grid-card {
    max-width: 420px;
    margin-top: 20px;
    padding: 24px 20px;
}

.table-grid-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.table-grid-header h2 {
    font-family: 'SeoulNamsan', 'Nanum Gothic', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: #3a3a3a;
    margin: 0;
}

.table-grid-close {
    width: 36px;
    height: 36px;
    border: none;
    background: #f0f0f0;
    border-radius: 50%;
    font-size: 1.3rem;
    color: #3a3a3a;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
}

.table-grid-close:hover {
    background: #E52521;
    color: #ffffff;
}

/* Table Grid */
.table-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.table-cell {
    background: #ffffff;
    border: 2px solid #e0e0e0;
    border-radius: 14px;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
}

.table-cell:hover {
    border-color: #E52521;
    background: #FFF0F0;
    transform: translateY(-2px);
    box-shadow: 0 3px 10px rgba(229, 37, 33, 0.18);
}

.table-cell:active {
    transform: translateY(0);
    box-shadow: none;
}

.table-number {
    font-family: 'Baloo 2', 'SeoulNamsan', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: #3a3a3a;
}

.table-cell:hover .table-number {
    color: #E52521;
}

/* Waiting Success Modal */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.modal-card {
    max-width: 340px;
    padding: 36px 28px 28px;
    text-align: center;
}

.modal-icon {
    width: 64px;
    height: 64px;
    background: #4CAF50;
    color: #ffffff;
    border-radius: 50%;
    font-size: 2rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
}

.modal-title {
    font-family: 'SeoulNamsan', 'Nanum Gothic', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: #3a3a3a;
    margin: 0 0 8px;
}

.modal-message {
    font-family: 'SeoulNamsan', 'Nanum Gothic', sans-serif;
    font-size: 0.9rem;
    color: #666666;
    margin: 0 0 24px;
    line-height: 1.5;
}

.modal-close-btn {
    width: auto;
    min-width: 120px;
    padding: 14px 36px;
}

/* Slide-in animation for table grid */
.table-grid-card {
    animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive */
@media (max-width: 380px) {
    .super-masio-text {
        font-size: 2rem;
    }

    .home-card {
        padding: 28px 20px 28px;
    }

    .table-grid {
        gap: 8px;
    }

    .table-number {
        font-size: 0.95rem;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Table Selection Toggle
    const btnTableSelect = document.getElementById('btnTableSelect');
    const tableGridCard = document.getElementById('tableGridCard');
    const btnCloseTableGrid = document.getElementById('btnCloseTableGrid');

    btnTableSelect.addEventListener('click', function() {
        if (tableGridCard.style.display === 'none') {
            tableGridCard.style.display = 'block';
            tableGridCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
            tableGridCard.style.display = 'none';
        }
    });

    btnCloseTableGrid.addEventListener('click', function() {
        tableGridCard.style.display = 'none';
    });

    // Table Cell Click → Navigate to Order Page
    const tableCells = document.querySelectorAll('.table-cell');
    tableCells.forEach(function(cell) {
        cell.addEventListener('click', function() {
            const tableId = this.dataset.tableId;
            window.location.href = '/order?table=' + tableId;
        });
    });

    // Waiting Success Modal (shown when redirected back with ?waiting=success)
    const modal = document.getElementById('waitingSuccessModal');
    const btnModalClose = document.getElementById('btnModalClose');
    const urlParams = new URLSearchParams(window.location.search);

    if (urlParams.get('waiting') === 'success') {
        modal.style.display = 'flex';
        // Clean up URL
        window.history.replaceState({}, document.title, '/');
    }

    btnModalClose.addEventListener('click', function() {
        modal.style.display = 'none';
    });

    modal.addEventListener('click', function(e) {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });
});
</script>
{% endblock %}
