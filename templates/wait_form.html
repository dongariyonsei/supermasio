{% extends "base.html" %}

{% block title %}웨이팅 등록{% endblock %}

{% block content %}
<div class="waiting-page">
    <!-- Page Title -->
    <h2 class="waiting-page-title">웨이팅</h2>

    <!-- Info Text -->
    <p class="waiting-info-text">자리가 없으신가요? 웨이팅을 등록하시면 자리가 나는 대로 연락드립니다.</p>

    <!-- White Info Card with Form -->
    <div class="mario-card waiting-card">
        <form id="waitingForm" method="POST" action="/waiting/add">
            <!-- 이름 -->
            <div class="form-group">
                <div class="form-field-container">
                    <label class="form-label" for="name">이름*</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="홍길동" required>
                </div>
            </div>

            <!-- 전화번호 -->
            <div class="form-group">
                <div class="form-field-container">
                    <label class="form-label" for="phone">전화번호*</label>
                    <input type="tel" id="phone" name="phone" class="form-input" placeholder="010-0000-0000" required>
                </div>
            </div>

            <!-- 인원수 -->
            <div class="form-group">
                <div class="form-field-container">
                    <label class="form-label" for="party_size">인원수*</label>
                    <div class="select-wrapper">
                        <select id="party_size" name="party_size" class="form-input form-select" required>
                            <option value="" disabled selected>선택하세요</option>
                            {% for n in range(1, 11) %}
                            <option value="{{ n }}">{{ n }}</option>
                            {% endfor %}
                        </select>
                        <span class="select-arrow">&#9662;</span>
                    </div>
                </div>
            </div>

            <!-- 특별 요청사항 -->
            <div class="form-group">
                <div class="form-field-container">
                    <label class="form-label" for="notes">특별 요청사항</label>
                    <textarea id="notes" name="notes" class="form-input form-textarea" placeholder="예: 추가 의자 필요" rows="3"></textarea>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="waiting-submit-btn">웨이팅 등록하기</button>
        </form>
    </div>
</div>

<style>
/* ========================================
   WAITING REGISTRATION PAGE STYLES
   ======================================== */

.waiting-page {
    min-height: calc(100vh - 120px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
    font-family: 'SeoulNamsan', 'Sunflower', 'Nanum Gothic', sans-serif;
}

/* Page Title */
.waiting-page-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: #3a3a3a;
    text-align: center;
    margin: 16px 0 8px;
}

/* Info Text */
.waiting-info-text {
    font-size: 0.9rem;
    font-weight: 400;
    color: #666666;
    text-align: center;
    line-height: 1.6;
    margin: 0 0 24px;
    max-width: 340px;
}

/* White Card */
.waiting-card {
    background: #ffffff;
    border-radius: 37px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
    width: 100%;
    max-width: 420px;
    padding: 28px 24px 32px;
}

/* Form Groups */
.form-group {
    margin-bottom: 16px;
}

.form-group:last-of-type {
    margin-bottom: 28px;
}

/* Field Container — pink border box */
.form-field-container {
    background: #fff4f4;
    border: 2px solid #ff2424;
    border-radius: 37px;
    padding: 12px 20px 14px;
}

/* Labels */
.form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: #3a3a3a;
    margin-bottom: 6px;
}

/* Inputs */
.form-input {
    display: block;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'SeoulNamsan', 'Nanum Gothic', sans-serif;
    font-size: 1rem;
    color: #3a3a3a;
    padding: 0;
}

.form-input::placeholder {
    color: #b0b0b0;
    font-weight: 400;
}

/* Textarea */
.form-textarea {
    resize: vertical;
    min-height: 60px;
    line-height: 1.5;
}

/* Select Wrapper */
.select-wrapper {
    position: relative;
}

.form-select {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    cursor: pointer;
    padding-right: 28px;
}

.form-select:invalid {
    color: #b0b0b0;
}

.select-arrow {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.7rem;
    color: #ff2424;
    pointer-events: none;
}

/* Submit Button */
.waiting-submit-btn {
    display: block;
    width: 100%;
    padding: 18px 24px;
    background: linear-gradient(180deg, #ff3333 0%, #d60a0a 100%);
    color: #ffffff;
    border: none;
    border-radius: 39px;
    cursor: pointer;
    font-family: 'SeoulNamsan', 'Nanum Gothic', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    box-shadow: 0 4px 16px rgba(214, 10, 10, 0.35);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    position: relative;
    top: 0;
}

.waiting-submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(214, 10, 10, 0.45);
}

.waiting-submit-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 8px rgba(214, 10, 10, 0.25);
    top: 2px;
}

/* Responsive */
@media (max-width: 380px) {
    .waiting-card {
        padding: 24px 18px 28px;
    }

    .form-field-container {
        padding: 10px 16px 12px;
    }

    .waiting-page-title {
        font-size: 1.4rem;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('waitingForm');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = new FormData(form);

        fetch('/waiting/add', {
            method: 'POST',
            body: formData
        })
        .then(function(response) {
            if (response.ok) {
                return response.json();
            } else {
                return response.json().then(function(data) {
                    throw new Error(data.detail || '등록 중 오류가 발생했습니다.');
                });
            }
        })
        .then(function(data) {
            if (data.success) {
                window.location.href = '/?waiting=success';
            } else {
                alert(data.message || '등록 중 오류가 발생했습니다.');
            }
        })
        .catch(function(error) {
            alert(error.message || '웨이팅 등록 중 오류가 발생했습니다.');
        });
    });
});
</script>
{% endblock %}
