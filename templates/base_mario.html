<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>{% block title %}슈퍼 마시오{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/mario.css?v=20260526-4">


    <style>
    @font-face {
        font-family: "bootstrap-icons";
        src: url("/static/fonts/bootstrap-icons.woff2") format("woff2");
        font-weight: normal;
        font-style: normal;
        font-display: block;
    }
    /* Figma main-page header (node 4076:176): red bar with home + hamburger.
       Sizing uses --vw so it freezes at the 520px column on desktop. */
    .mh-outer { position: relative; z-index: 50; }
    .mh-redbar {
        max-width: var(--m-maxw);
        margin: 0 auto;
        height: calc(18.4 * var(--vw));
        min-height: 56px;
        background: #d70a0a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 calc(5.1 * var(--vw));
        box-shadow: 0 6px 18px rgba(0,0,0,0.18);
        position: relative;
    }
    /* Equal-sized icon buttons — home (left) and hamburger (right) match height. */
    .mh-icon-btn {
        width: calc(7.72 * var(--vw));
        height: calc(7.72 * var(--vw));
        min-width: 30px;
        min-height: 30px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        background: none;
        color: #ffffff;
        text-decoration: none;
        cursor: pointer;
        flex-shrink: 0;
    }
    .mh-icon-btn i { font-size: calc(7.2 * var(--vw)); line-height: 1; }
    /* Brand logo, top-left (Figma 자산 2@4x). */
    .mh-logo-link { display: flex; align-items: center; flex-shrink: 0; }
    .mh-logo { height: calc(18 * var(--vw)); min-height: 52px; width: auto; object-fit: contain; }
    .mh-page-title:empty { display: none; }
    .mh-page-title {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-family: 'SeoulNamsan', sans-serif;
        font-size: clamp(1.35rem, calc(5.2 * var(--vw)), 1.7rem);
        color: #ffffff;
        line-height: 1.1;
        white-space: nowrap;
        pointer-events: none;
        max-width: 42%;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    /* Hamburger dropdown */
    .mh-top-menu { position: relative; }
    .mh-top-menu > summary { list-style: none; }
    .mh-top-menu > summary::-webkit-details-marker { display: none; }
    .mh-nav-panel {
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 3px 21px -4px rgba(0,0,0,0.25);
        min-width: 180px;
        padding: 6px;
        z-index: 60;
    }
    .mh-nav-panel a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        color: #3a3a3a;
        text-decoration: none;
        font-weight: 700;
        border-radius: 10px;
    }
    .mh-nav-panel a:hover,
    .mh-nav-panel a:focus { background:#fff4f4; color:#d70a0a; }
    </style>


    {% block extra_css %}{% endblock %}
</head>
<body class="mario-body">
    <header class="mh-outer">
        <div class="mh-redbar">
            <a class="mh-logo-link" href="/" aria-label="슈퍼 마시오 홈">
                <img class="mh-logo" src="/static/images/mario/logo.png" alt="슈퍼 마시오">
            </a>
            <div class="mh-page-title">{% block page_title %}{% endblock %}</div>
            <details class="mh-top-menu">
                <summary class="mh-icon-btn" aria-label="메뉴">
                    <i class="bi bi-list"></i>
                </summary>
                <div class="mh-nav-panel">
                    <a href="/"><i class="bi bi-house-door-fill me-2"></i>홈으로</a>
                    <a href="/table-select"><i class="bi bi-grid-3x3-gap me-2"></i>테이블 선택</a>
                    <a href="/waiting"><i class="bi bi-clock me-2"></i>웨이팅 등록</a>
                    {% if table_id %}<a href="/chat/{{ table_id }}"><i class="bi bi-chat-dots me-2"></i>채팅</a>{% else %}<a href="/chat"><i class="bi bi-chat-dots me-2"></i>채팅</a>{% endif %}
                </div>
            </details>
        </div>
    </header>

    <main class="mario-main">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
